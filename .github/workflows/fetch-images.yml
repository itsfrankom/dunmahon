# Downloads portfolio thumbnails from Squarespace and saves them in the repo.
# Run it from the Actions tab ("Run workflow"); it also runs when this file changes.
name: Fetch portfolio images
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/fetch-images.yml", "scripts/fetch-images.mjs"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-images.mjs
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images
          git diff --cached --quiet && echo "No new images" || (git commit -m "Add portfolio thumbnails from Squarespace" && git push)
